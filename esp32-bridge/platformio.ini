; PlatformIO Project Configuration for Lumina ESP32 Bridge
;
; This firmware runs on an ESP32 and acts as a bridge between
; Firebase Firestore and WLED devices on the local network.
;
; It polls Firestore for pending commands and executes them
; via HTTP to WLED devices, enabling remote control without
; requiring WLED to support MQTT+TLS.
;
; Environments
;   esp32dev                  RELEASE. The only image that goes on a fielded
;                             bridge. Requires src/ota_pubkey.h (production
;                             OTA public key) — the build fails without it.
;   esp32dev-bench            Bench bridge only: bench OTA key + "bench"
;                             channel, short watchdog/probation timers, and
;                             /api/debug/* routes. NEVER flash to a fielded
;                             bridge; tools/sign_firmware.py refuses to sign
;                             it unless given --allow-bench.
;   esp32dev-bench-crash      Bench rollback test A: panics 45 s into OTA
;                             probation (bootloader rollback).
;   esp32dev-bench-unhealthy  Bench rollback test B: never reports healthy
;                             (explicit rollback at the probation deadline).
;
; Every version below is pinned so a signed OTA image is reproducible. The
; pins are the exact set the fielded 1.2 image was built from (framework
; 2.0.17, ArduinoJson 7.4.2, WiFiManager git 1327b40 — the cached copy that
; reported "2.0.17"; the old spec tracked git master).

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212

lib_deps =
    ; ArduinoJson for parsing WLED responses
    bblanchon/ArduinoJson@7.4.2
    ; WiFiManager for easy WiFi setup
    https://github.com/tzapu/WiFiManager.git#1327b40ac0cdb968cf62b2bab94ffb922a18e71f

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Enable async TCP for better performance
    -DASYNC_TCP_SSL_ENABLED=0
    ; A release image without OTA would need another USB visit to every
    ; bridge — refuse to build one.
    -DBRIDGE_REQUIRE_OTA_KEY=1

; Upload settings
upload_speed = 921600

; Two 1.875 MB OTA app slots (was huge_app.csv: one 3 MB slot, no OTA).
; nvs (0x9000, 0x5000), otadata (0xe000) and coredump (0x3F0000) are at the
; SAME offsets in both tables, so a USB reflash that does NOT erase flash
; keeps the bridge's Wi-Fi credentials, pairing and per-bridge credential.
board_build.partitions = min_spiffs.csv

[bench]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DASYNC_TCP_SSL_ENABLED=0
    -DBRIDGE_REQUIRE_OTA_KEY=1
    -DBRIDGE_BENCH=1
    '-DBRIDGE_OTA_PUBKEY_FILE="ota_pubkey_bench.h"'
    '-DOTA_CHANNEL="bench"'
    -DBRIDGE_LOOP_WDT_TIMEOUT_S=30
    -DBRIDGE_PROGRESS_TIMEOUT_MS=90000UL
    -DOTA_FIRST_CHECK_DELAY_MS=30000UL
    -DOTA_CHECK_INTERVAL_MS=120000UL
    -DOTA_CHECK_JITTER_MS=0UL
    -DOTA_PROBATION_MS=180000UL

[env:esp32dev-bench]
extends = env:esp32dev
build_flags = ${bench.build_flags}

[env:esp32dev-bench-crash]
extends = env:esp32dev
build_flags = ${bench.build_flags} -DBRIDGE_BENCH_BAD_IMAGE=1

[env:esp32dev-bench-unhealthy]
extends = env:esp32dev
build_flags = ${bench.build_flags} -DBRIDGE_BENCH_BAD_IMAGE=2
