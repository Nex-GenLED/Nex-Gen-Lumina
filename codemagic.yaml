workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NexGen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-workflow
      vars:
        BUNDLE_ID: com.nexgenled.command
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          BUILD_NUM=${PROJECT_BUILD_NUMBER:-$(date +%s)}
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUM}/" pubspec.yaml
          echo "Version: $(grep '^version:' pubspec.yaml)"
      - name: Install CocoaPods
        script: |
          # Belt-and-suspenders clean state: even though Codemagic builds
          # from a fresh git clone with no cache: block, wipe every layer
          # that has ever shipped a "trailing bug" symptom. Cheap insurance
          # against stale Pods, stale plugin symlinks, or stale CocoaPods
          # download cache silently masking a Podfile change.
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod cache clean --all
          pod install --repo-update
      - name: Build IPA
        script: flutter build ipa --release
      - name: Dump signed entitlements
        # Read-only diagnostic for #61 SSID layer disambiguation. `flutter
        # build ipa` swallows the xcodebuild ProcessProductPackaging block,
        # so we inspect the signed binary directly. Prints two things:
        #   1. Entitlements actually compiled into the signed Runner.app
        #      (codesign -d --entitlements :-) — what iOS will enforce.
        #   2. Entitlements the embedded provisioning profile GRANTS — the
        #      profile's capability surface.
        # If `com.apple.developer.networking.wifi-info` is in the profile
        # but NOT in the binary, archive/export is stripping it (layer 1
        # confirmed). If it's in the binary, layer 1 is ruled out and the
        # cause is Core Location dormancy at runtime (the in-app
        # instrumentation will name it as corelocation_warmup_failed).
        script: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            APP=$(find build/ios -name "Runner.app" -type d | head -1)
          fi
          echo "=== signed app location ==="
          echo "$APP"
          echo "=== codesign entitlements (what the binary carries) ==="
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo "=== embedded provisioning profile entitlements (what the profile grants) ==="
          if [ -f "$APP/embedded.mobileprovision" ]; then
            security cms -D -i "$APP/embedded.mobileprovision" 2>&1 | \
              plutil -extract Entitlements xml1 -o - - 2>&1 || true
          else
            echo "(no embedded.mobileprovision at $APP)"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
