workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    # BUILD TRIGGER — tag-deliberate, not push-driven (#62).
    #
    # `submit_to_testflight: true` below auto-submits every GREEN build. That was
    # harmless when main moved once a day; main now moves several times a night,
    # so every docs commit shipped a TestFlight build. On 2026-08-11 that put two
    # artifacts into TestFlight carrying +72 code under a +71 telemetry stamp,
    # with no ledger row able to identify either — and TestFlight served a stale
    # build 288 ahead of 291 during a hardware verification, which is the failure
    # this guards against.
    #
    # A tag is now the deliberate act: `git tag build-74 && git push origin
    # build-74` produces exactly one TestFlight build from exactly one SHA.
    #
    # ⚠️ THIS BLOCK ALONE IS NOT THE FIX. The push trigger lived in the Codemagic
    # UI webhook, not in this file, so a yaml-only change would read as fixed
    # while pushes kept building. The UI was switched to tag-only in the same
    # session as this commit. If push-builds ever reappear, check the UI FIRST —
    # this file cannot disable a trigger it does not own.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'build-*'
          include: true
    integrations:
      app_store_connect: NexGen
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-workflow
      vars:
        BUNDLE_ID: com.nexgenled.command
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Test and analyze (build gate)
        # THE GATE. A red suite or an analyzer error must stop this workflow
        # before `publishing:` is ever reached — `submit_to_testflight: true`
        # means anything that gets past here goes to real testers.
        #
        # ORDERING IS LOAD-BEARING. This runs BEFORE "Set build number", which
        # rewrites `version:` in pubspec.yaml with `sed -i`. Placed after it,
        # the gate would be testing a tree that no longer matches any commit —
        # green on a rewritten pubspec says nothing about the SHA that shipped.
        # Here, what is tested IS the checked-out commit.
        #
        # HARDWARE TESTS STAY SKIPPED, structurally. The 4 live-bench cases
        # (1 in test/hardware/base_ladder_repair_live_test.dart, 3 in
        # test/hardware/preset_heal_live_test.dart) guard on
        #   const bool kRunHw = bool.fromEnvironment('RUN_HW', defaultValue: false);
        # `bool.fromEnvironment` reads COMPILE-TIME --dart-define values, not
        # process env vars. This step passes no --dart-define, so those cases
        # skip no matter what any environment group defines. A CI runner cannot
        # reach the bench rig at 192.168.1.150 anyway. Do NOT add
        # `--dart-define=RUN_HW=true` here.
        script: |
          set -euo pipefail
          echo "=== gate: commit under test ==="
          git rev-parse HEAD
          grep '^version:' pubspec.yaml
          echo "RUN_HW env (informational only; does not reach the tests): ${RUN_HW:-<unset>}"

          flutter pub get
          flutter test
          flutter analyze
      - name: Set build number
        script: |
          BUILD_NUM=${PROJECT_BUILD_NUMBER:-$(date +%s)}
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUM}/" pubspec.yaml
          echo "Version: $(grep '^version:' pubspec.yaml)"
      - name: Install CocoaPods
        script: |
          # Belt-and-suspenders clean state: even though Codemagic builds
          # from a fresh git clone with no cache: block, wipe every layer
          # that has ever shipped a "trailing bug" symptom. Cheap insurance
          # against stale Pods, stale plugin symlinks, or stale CocoaPods
          # download cache silently masking a Podfile change.
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod cache clean --all
          pod install --repo-update
      - name: Build IPA
        # `--split-debug-info=<dir>` emits the Dart AOT symbol file
        # (`app.ios-arm64.symbols`) to <dir> instead of leaving Dart
        # symbols only in the embedded App.framework. The release binary
        # is still stripped (no behavior change, no signing change, no
        # entitlements change), but now we have a portable symbols file
        # we can artifact and pass to `flutter symbolize` from any
        # platform — no Mac/atos and no ASC dSYM round-trip needed.
        #
        # CLAUDE.md's "build/debug-info/ — Keep these files — never
        # commit … never delete after a release" note assumed builds
        # were producing this directory; this commit makes the CI
        # actually do so.
        #
        # Usage post-build:
        #   flutter symbolize -i app.ios-arm64.symbols -d stack.txt
        # The .symbols file is small (~MB), versioned per build, and
        # only matches stack traces from THIS exact build. Keep one
        # copy per shipped build.
        #
        # No --obfuscate: that would rename Dart symbols in the binary
        # so the symbols file is the ONLY way to read frames, which is
        # a heavier change than this diagnostic-only intent warrants.
        script: flutter build ipa --release --split-debug-info=build/debug-info/ios
      - name: Dump signed entitlements
        # Read-only diagnostic for #61 SSID layer disambiguation.
        #
        # Why the exported IPA, not the archive: build 187's dump showed
        # "code object is not signed at all" — the archive's Runner.app is
        # the PRE-EXPORT, unsigned binary. xcodebuild -exportArchive does
        # the actual re-sign with the pinned profile, and the entitlements
        # blob the device enforces is whatever made it into THAT binary.
        # Inspecting the archive can't catch an export-stage strip.
        #
        # Two outputs:
        #   1. codesign -d --entitlements :- on Payload/Runner.app —
        #      entitlements compiled into the SHIPPED binary (what iOS
        #      enforces at runtime).
        #   2. embedded.mobileprovision's Entitlements dict — what the
        #      pinned profile grants (the upper bound any export re-sign
        #      intersects against).
        #
        # If `com.apple.developer.networking.wifi-info` is in the profile
        # but NOT in the shipped binary, manual export is stripping it
        # (Item #61 layer 1 confirmed → revert signing mode or fix
        # ExportOptions). If it's missing from the profile too, the App
        # ID capability is not enabled — fix in Apple Developer portal
        # and regenerate the profile.
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA" ]; then
            echo "(no .ipa found under build/ios/ipa — skipping dump)"
            exit 0
          fi
          echo "=== exported ipa ==="
          echo "$IPA"
          DUMP_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$DUMP_DIR" || true
          APP="$DUMP_DIR/Payload/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "(no Payload/Runner.app inside $IPA — unexpected layout)"
            exit 0
          fi
          echo "=== codesign entitlements (what the shipped binary carries) ==="
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo "=== embedded provisioning profile entitlements (what the profile grants) ==="
          if [ -f "$APP/embedded.mobileprovision" ]; then
            security cms -D -i "$APP/embedded.mobileprovision" 2>&1 | \
              plutil -extract Entitlements xml1 -o - - 2>&1 || true
          else
            echo "(no embedded.mobileprovision at $APP)"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      # Dart AOT symbol file from --split-debug-info. Per-build artifact;
      # download from the Codemagic build page and feed to:
      #   flutter symbolize -i app.ios-arm64.symbols -d <crash_stack>.txt
      # to resolve App.framework offsets to Dart function names. Runs on
      # any platform with the Flutter SDK installed (no Mac required).
      - build/debug-info/ios/*.symbols
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
